services:
  # 1. Redis Service (Caching, Rate Limiting, Sliding Window Session Memory)
  redis-cache:
    image: redis:7-alpine
    container_name: nyaya-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Qdrant Vector Database (Vector Search RAG engine)
  qdrant-db:
    image: qdrant/qdrant:latest
    container_name: nyaya-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      # /dev/tcp is bash-only; CMD-SHELL uses /bin/sh (dash)
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 3. Nyaya Sahayaka Backend (FastAPI + LangGraph Multi-Agent System)
  legal-agent-ai:
    build:
      context: ./legal-agent-ai
      dockerfile: Dockerfile
    container_name: nyaya-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis-cache:6379/0
      - QDRANT_URL=${QDRANT_URL:-http://qdrant-db:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_ORIGINS=http://localhost:3000,https://nayaya-sahayaka.netlify.app
    depends_on:
      redis-cache:
        condition: service_healthy
      qdrant-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s

  # 4. Nyaya Sahayaka Web Frontend (Next.js 16 + React 19 UI)
  legal-agent-web:
    build:
      context: ./legal-agent-web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_ vars must be baked in at build time
        - NEXT_PUBLIC_API_URL=http://legal-agent-ai:8000
        - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL:-}
        - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL:-}
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: nyaya-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Runtime-only secrets (not inlined by Next.js)
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - CONVEX_DEPLOYMENT=${CONVEX_DEPLOYMENT:-}
    depends_on:
      legal-agent-ai:
        condition: service_healthy

volumes:
  redis-data:
    driver: local
  qdrant-storage:
    driver: local
